<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stay - Wadjemup / Rottnest Island</title>
<link rel="stylesheet" href="/static/brand/arag-tokens.css" />
<link rel="stylesheet" href="/static/brand/progress-header.css" />
<link rel="stylesheet" href="/static/css/rottnest.css" />
</head>
<body class="rw-body">

<section class="rw-section-navy" style="padding:56px 0 40px;">
  <div class="rw-container">
    <div class="rw-eyebrow" style="color:#FDBC3F;">Stay</div>
    <h1 class="rw-h1" style="color:white; margin-top:8px;">Wake up to the ocean, whatever your budget.</h1>
    <p class="rw-lead" style="color:#AEE2E9; max-width:56ch;">From beachfront suites to a good old-fashioned dorm bed - every listing below is put together live from the island's own accommodation pages, real thumbnails and real highlights, nothing hand-typed.</p>
  </div>
</section>

<section class="rw-section rw-section-sand">
  <div class="rw-container">
    <div id="rw-stay-grid" class="rw-grid rw-grid-3"></div>
  </div>
</section>

<script>window.RW_PAGE = { nav: 'stay', revealKey: 'stay' };</script>
<script src="/static/js/shared.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/assistant-widget.js"></script>
<script src="/static/js/chat-widget.js"></script>
<script>
(function(){
  const grid = document.getElementById('rw-stay-grid');
  grid.innerHTML = Array.from({length:6}).map(() => `
    <div class="rw-card"><div class="rw-skeleton" style="aspect-ratio:16/10;"></div>
    <div style="padding:16px;"><div class="rw-skeleton" style="height:16px;width:70%;margin-bottom:8px;"></div></div></div>
  `).join('');

  fetch('/api/catalog?category=' + encodeURIComponent('Accommodation') + '&limit=60')
    .then(r => r.json())
    .then(data => {
      if (!data.items.length) { grid.innerHTML = '<p>No accommodation pages found.</p>'; return; }
      grid.innerHTML = data.items.map(item => `
        <a href="/r/${item.resource_id}" class="rw-card rw-catalog-card rw-link-plain">
          <img class="rw-catalog-thumb" src="/api/thumbnail/${item.resource_id}" alt="${item.title}" loading="lazy" onerror="this.style.display='none'" />
          <div class="rw-catalog-body">
            <h3 class="rw-catalog-title">${item.title.replace(' | Rottnest Island','')}</h3>
            ${item.hook ? `<p class="rw-catalog-hook">${item.hook}</p>` : ''}
            ${item.highlights && item.highlights.length ? `<ul class="rw-catalog-highlights">${item.highlights.map(h=>`<li>${h}</li>`).join('')}</ul>` : ''}
            <div class="rw-catalog-chips">${(item.chips||[]).slice(0,4).map(c=>`<span class="rw-chip">${c}</span>`).join('')}</div>
          </div>
        </a>
      `).join('');
    });
})();
</script>
</body>
</html>
